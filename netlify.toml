# ============================================================
#  Generación Tech · configuración para Netlify
#  (si publicás en otro hosting, ver LEEME-PUBLICAR.md)
# ============================================================
[build]
  publish = "."

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-xMEne5xSNlgeOligOATNEvyFpyN5H3HG/E/qDyG8S5Y='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formsubmit.co https://formspree.io; form-action 'self' https://formsubmit.co https://formspree.io; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Caché larga para fuentes e imágenes; CSS/JS se revalidan
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Archivos internos que NO deben quedar públicos
[[redirects]]
  from = "/_respaldo/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/serve.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LEEME-PUBLICAR.md"
  to = "/404.html"
  status = 404
  force = true
